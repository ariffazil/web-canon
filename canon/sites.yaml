  - path: /institution/aaa
    role: AGENTIC_COCKPIT  # THE BRIDGE
    description: "AAA — cockpit, A2A gateway, agent identity registry. The bridge between human and agentic sides."
    legacy_path: /aaa
    port: 3001
    toroidal_center: true
    accent_exception: amber  # ONLY non-primer exception
    deployable: true

  - path: /institution/wealth
    role: OLD_INSTITUTION
    description: "WEALTH — capital compute. The legacy institution alongside the new."
    legacy_path: /wealth
    port: 18082
    deployable: true

  - path: /institution/ledger
    role: FEDERATION_MEMORY
    description: "VAULT999 immutable ledger. Public proof surface, not direct vault."
