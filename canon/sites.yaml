# ─── EARTH ORGANS ────────────────────────────────────────────────────────
earth_organ_paths:
  - path: /earth/geox
    role: EARTH_KNOWN
    description: "GEOX — earth intelligence. Seismic, wells, basins. Physics-gated geoscience."
    legacy_path: /geox
