# Site registry — descriptive of live Caddy. Not a Caddy generator.
# Measured 2026-11-18T13:09:24Z. Hop table: canon/redirects.yaml (one copy).
# Route source of truth: /etc/caddy/vhosts/*.conf
# Datum ownership: canon/ownership.yaml (2026-11-17). Do not contradict it.
# This file does not drive Caddy. canon-sync.sh only copies yaml.

version: "3.1.0"
status: DESCRIPTIVE
observed_at: "2026-11-18T13:09:24Z"
reconciled_at: "2026-11-18"
route_source_of_truth: /etc/caddy/vhosts/*.conf
generator: none

do_not:
  - "Do not generate or reload Caddy from this file."
  - "Do not 301 working organ hosts onto /institution, /earth, or /human organ paths. Those paths return 404."
  - "Do not 410 headscale.arif-fazil.com. Node join uses that hostname."
  - "Do not git pull arifOS, AAA, WEALTH, HERMES, GEOX, or CHRON over the running trees. Disk on this host is the operational tree. GitHub is a lagging mirror."
  - "Do not deploy the dirty arif-fazil.com tree to change About. The served page is the short identity line. A longer paragraph in source is unshipped."
  - "Do not treat https://arif-fazil.com/canon/*.yaml as this file. That URL is the site SPA fallback."

rule: |
  Two layers. Human doors are paths on arif-fazil.com. Machine and organ doors
  are their own subdomains and stay there. www, apex, the arifos host, forge,
  and a-forge are redirects. claw and openclaw are 410. The August 2026 rule
  "every subdomain 301s onto a path under one domain" is retired.

runtime_sot: |
  For arifOS, AAA, WEALTH, HERMES, GEOX, and CHRON, the running tree on this
  host is the operational source. Large ahead/behind counts against origin/main
  are diverged history, not a pile of unpushed commits. Do not reconcile them
  from this registry. A-FORGE on main was 5 commits ahead of origin and clean
  at the 2026-11-18 probe. FRAME and this repo matched their cached GitHub
  heads before this edit.

# Section pages that answer 200. They are not the organ homes.
section_pages:
  - path: /human/
    scope: HUMAN
    organ_home: false
    public_organ_door: https://well.arif-fazil.com/
  - path: /institution/
    scope: INSTITUTION
    organ_home: false
  - path: /earth/
    scope: EARTH
    organ_home: false
    public_organ_door: https://geox.arif-fazil.com/
  - path: /laws/
    scope: CROSS_CUTTING
    note: "https://arif-fazil.com/f13 redirects here. https://arif-fazil.com/f13/ is 404."
  - path: /arifos/
    scope: TRUTH
    note: "The arifos host 301s here. This path is the public truth page. It is not /institution/arifos/."

# Design paths from 2026-08-01. Not served. HTTP 404 text/plain on 2026-11-18.
