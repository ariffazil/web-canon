# arifOS Federation — Canonical Site Registry (TRINITY IA, v2026.08.01)
# ONE source of truth for site identity, ownership, and audience.
# Doctrine: Trinity — HUMAN · INSTITUTION · EARTH (with sovereign anchor /arif + cross-cutting /laws)
# AI agents replace institutions, not humans. The IA mirrors this.
# Schema: canon/public-state.schema.json

version: "3.0.0"
observed_at: "2026-08-01T08:00:00Z"
ratified_by: "sovereign (F13) — D1-D9 ratified 2026-08-01, 999_SEAL"
doctrine: |
  Trinity IA. Three trinity scopes (HUMAN, INSTITUTION, EARTH) plus a sovereign
  anchor (/arif) and cross-cutting /laws. AI agents live INSIDE institution
  (they are the new institution). Earth is the void's edge (the membrane
  + edge of the unknown). Each scope pulls accent from exactly one primer
  family. Red is rationed (sovereign strip · verdict chips · seals only).

rule: |
  All public surfaces are paths under arif-fazil.com. Legacy subdomains
  redirect to canonical paths (one-hop, no chains). Internal services
  (Tailscale mesh only) get 410 Gone publicly.

# ─── TRINITY SCOPES ──────────────────────────────────────────────────────
trinity_paths:
  - path: /arif
    scope: SOVEREIGN
    canonical_role: f13-anchor
    primary_audience: [public, sovereign-only-F13]
    description: "Sovereign anchor. Bare background, no pattern. F13 is the human's seat."
    primary_organ: none
    pattern: bare
    deployable: true

  - path: /human
    scope: HUMAN
    canonical_role: substrate-and-dignity
    primary_audience: [public, health-workers, sociologists]
    description: "HUMAN scope. The people-side of the federation. Substrate, dignity, witness."
    primary_organ: WELL
    accent_family: red
    pattern: chordial-light
    deployable: true

  - path: /institution
    scope: INSTITUTION
    canonical_role: old-and-new-institution
    primary_audience: [public, regulators, executives]
    description: |
      INSTITUTION scope. Old institutions (WEALTH) and new institutions (arifOS,
      A-FORGE, AAA — the agentic layer) live here. The transformation is visible
      on the page: old beside new.
    primary_organ: AAA
    accent_family: yellow
    pattern: orthogonal-fractal
    toroidal_anchor: trinity-ring
    deployable: true

  - path: /earth
    scope: EARTH
    canonical_role: physical-and-void
    primary_audience: [public, geoscientists, energy-professionals, philosophers]
    description: |
      EARTH scope. Known earth (GEOX) plus the void (membrane + edge — HERMES,
      MCP). The void is the edge of the earth, not a separate scope.
    primary_organ: GEOX
    accent_family: teal
    pattern: chordial-dense
    deployable: true

  - path: /laws
    scope: CROSS_CUTTING
    canonical_role: constitutional-floors
    primary_audience: [researchers, auditors, sovereign]
    description: "F1-F13 constitutional floors. The laws that govern the federation. Faintest pattern."
    primary_organ: arifOS-kernel
    accent_family: void-blue
    pattern: orthogonal-fractal-faintest
    deployable: true

# ─── AGENTIC ORGANS (live inside /institution) ──────────────────────────
agentic_organ_paths:
  - path: /institution/arifos
    role: AGENTIC_KERNEL
    description: "arifOS constitutional kernel — judge, seal gate, F1-F13 enforcement."
