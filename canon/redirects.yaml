# ─── CANARY (D6, D8) ──────────────────────────────────────────────────
# Phase 4a applies redirects to WELL ONLY first. 15-min cadence × 72h
# sentinel sweep. If 0 unexpected 5xx → green → Phase 4b opens remaining
# organs. This is the canary gate in writing.

canary:
  scope: well
  redirect_targets:
    - from: well.arif-fazil.com
      to: https://arif-fazil.com/human/well/
  sentinel:
    cadence_minutes: 15
    window_hours: 72
    success: "0 unexpected-5xx over 72h"
  on_green: "Phase 4b opens remaining organs (human/institution/earth)"
  on_red: "888_HOLD — investigate before proceeding"
  one_hop_assertion: "well./X → canonical, never chained"