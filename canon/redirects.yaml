# arifOS Federation — Canonical Redirect Map
# Generated from canon/sites.yaml (unified_paths + agentic_organ_paths +
# earth_organ_paths + human_organ_paths + aliases + protocol_endpoints + tombstones).
# D3 (one-hop only) + D1 (MCP exempt) + D7 (tombstones) all enforced here.
# DITEMPA BUKAN DIBERI

# ─── 301 PERMANENT REDIRECTS (subdomain → path) ───────────────────────
# Rule D3: ONE-HOP ONLY. Each redirect lands directly on the canonical
# path. No chains (subdomain-301 → path-301 → another-path-301).

redirects:
  # Root + www
  - from: www.arif-fazil.com
    to: https://arif-fazil.com
    code: 301
    permanent: true

  # Agentic organs (subdomain → /institution/<organ>)
  - from: arifos.arif-fazil.com
    to: https://arif-fazil.com/institution/arifos/
    code: 301
    permanent: true
  - from: aaa.arif-fazil.com
    to: https://arif-fazil.com/institution/aaa/
    code: 301
    permanent: true
  - from: forge.arif-fazil.com
    to: https://arif-fazil.com/institution/aforge/
    code: 301
    permanent: true
  - from: wealth.arif-fazil.com
    to: https://arif-fazil.com/institution/wealth/
    code: 301
    permanent: true

  # Earth organ
  - from: geox.arif-fazil.com
    to: https://arif-fazil.com/earth/geox/
    code: 301
    permanent: true

  # Human organ
  - from: well.arif-fazil.com
    to: https://arif-fazil.com/human/well/
    code: 301
    permanent: true

  # Earth + membrane (one-hop)
  - from: mcp.arif-fazil.com
    to: https://arif-fazil.com/earth/mcp/
    code: 301
    permanent: true
  - from: hermes.arif-fazil.com
    to: https://arif-fazil.com/earth/hermes/
    code: 301
    permanent: true

  # Legacy / retired (was /wealth/makcikgpt)
  - from: makcikgpt.arif-fazil.com
    to: https://arif-fazil.com/institution/makcikgpt/
    code: 301
    permanent: true
  - from: arifosmcp.arif-fazil.com
    to: https://arif-fazil.com/earth/mcp/
    code: 301
    permanent: true
  - from: apex.arif-fazil.com
    to: https://arif-fazil.com
    code: 301
    permanent: true

