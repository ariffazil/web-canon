# Route map — descriptive of live Caddy. Not a generator input.
# Measured 2026-11-18T13:09:24Z (curl --max-redirs 0, then slash-twin and canonical re-probe).
# Source of truth for routes: /etc/caddy/vhosts/*.conf
# This file describes that config. Nothing on this host generates Caddy from it.
# canon-sync.sh only copies yaml. Do not apply these rows onto Caddy.
# Do not put a from/to pair whose target 404s. The August 2026 path-collapse
# (/institution/<organ>, /earth/<organ>, /human/well) returns 404 text/plain.
# Reapplying it breaks doors that answer today.
#
# redirect-lint.py reads every from/to pair and checks the target, not the hop.
# Rows that would fail that lint (both slash shapes return 200, or the page's
# canonical names a different URL) are recorded below with other keys.

