# ─── PROTOCOL ENDPOINTS (D1 — exempt from 301) ────────────────────────
# These DO NOT redirect. They dual-serve on both subdomain AND canonical
# path. Sunset header on subdomain variant. ≥2 release cycle retirement.
# Sentinel (D7) monitors 5xx rate on these paths.

protocol_exempt:
  - host: forge.arif-fazil.com
    path: /mcp
    role: MCP_GATEWAY
    note: "dual-served; sunset telemetry-gated"
  - host: mcp.arif-fazil.com
    path: /
