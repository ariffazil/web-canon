# FEDERATION OWNERSHIP MAP — one datum, one owner
# STATUS: CANON — ratified 2026-11-17. Source proposal: /root/forge_work/proposals/ownership/ownership-v1.yaml
# Authority: F13 "fix all" 2026-11-17; owner WEB_ATLAS; allowed mutators A-FORGE/ARIF.
# Consumer: check_ownership.py + every site/deploy audit. Failure class: truth duplication across surfaces.

version: "1.0.0"
status: CANON
as_of: "2026-11-17"
author: "333-AGI"
ratified_by: "F13 — 'fix all' 2026-11-17 (lease request LEASE-REQUEST.md)"
promoted_at: "2026-11-17T03:15:00+08:00"
doctrine: |
  One datum, one owner. A surface may render what it owns, may summarise another
  owner's state in one line with a link, and must not re-render the owner's data.
  Ownership is a property of the datum, not of the page or the host.
rule: |
  Every rendered datum has exactly one owner. Every non-owner surface links to the
  owner. A surface that renders data it does not own is a defect (F2 truth, F4 clarity).
  A view (e.g. /999/ for the ledger) is allowed only when the map declares it as a view
  and names the owner it links to.

# Canonical invariants — F13 assessment 2026-11-17.
# Enforced today: OWN-001 (disjointness), OWN-002 (may_render=>must_link),
# OWN-003 (view owns nothing), OWN-006 (public boundary), OWN-008 (output semantics).
# Documented, not yet machine-checked: OWN-004 (observation time), OWN-005 (synthetic
# status label), OWN-007 (canonical owner changes require an F13 lease).
invariants:
  - { id: OWN-001, rule: exactly_one_owner_per_domain }
  - { id: OWN-002, rule: non_owner_surfaces_must_declare_source }
  - { id: OWN-003, rule: views_must_not_claim_canonical_authority }
  - { id: OWN-004, rule: live_values_must_include_observation_time }
  - { id: OWN-005, rule: synthetic_status_must_be_explicitly_labelled }
  - { id: OWN-006, rule: public_surfaces_must_not_expose_internal_actor_telemetry }
  - { id: OWN-007, rule: canonical_owner_changes_require_f13_lease }
  - { id: OWN-008, rule: declaration_pass_does_not_imply_runtime_pass }

# OWN-006 probe. The boundary is approved (F13 2026-11-17) but not yet executed
# (T3: Rust rebuild + Caddy reload). The checker must fail until it is executed.
public_boundary:
  forbidden_signatures: [per_actor, risk_class, execution_trace]
  targets:
    - "https://arifflow.arif-fazil.com/"
    - "https://arifflow.arif-fazil.com/health"

